dataset:
  raw_dir: data/raw
  processed_dir: data/processed
  nodes_file: data/nodes.csv
  series_file: data/processed/series.npy
  train_ratio: 0.7
  val_ratio: 0.15

graph:
  type: contiguity
  normalize: symmetric
  mode: distance_threshold   # distance_threshold | knn
  radius_km: 800.0
  knn_k: 8

model:
  num_nodes: 10
  features: 3
  lookback: 14
  forecast_horizon: 7
  hidden_gnn: 32
  hidden_lstm: 64
  add_log1p: true
  add_roll_7: true
  add_roll_14: true

training:
  seed: 42
  lr: 0.001
  epochs: 5
  batch_size: 32
  num_workers: 0
  early_stopping_patience: 3
  horizon_weight_decay: 0.9

rl:
  state_dim: 16
  num_actions: 4
  lr: 0.001
  episodes: 5
  steps_per_episode: 50
  batch_size: 32
  epsilon: 0.1


